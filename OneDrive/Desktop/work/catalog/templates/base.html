<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Book Management{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: rgb(239, 230, 230);
            overflow-x: hidden;
        }

        /* Background splash */
        .splash {
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            pointer-events: none;

            background: radial-gradient(
                circle,
                rgba(59, 130, 246, 0.35),
                rgba(168, 85, 247, 0.20),
                transparent 70%
            );

            transform: translate(-50%, -50%);
            z-index: -1;

            transition: left 0.15s ease, top 0.15s ease;
        }

        /* Header */
        header {
            padding: 25px 50px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        /* Navigation */
        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Main */
        main {
            padding: 50px;
        }

        /* Main content box */
        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);
        }

        /* Buttons */
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            background: #6366f1;
            color: white;
        }

        button:hover {
            background: #4f46e5;
        }

        /* Messages */
        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.2);
        }
    </style>
</head>

<body>

    <!-- Mouse splash effect -->
    <div class="splash" id="splash"></div>


    <!-- Header -->
    <header>

        <h1>📚 Book Management System 📚</h1>

        <nav>
            <a href="{% url 'book_list' %}">Books</a>

            <a href="{% url 'book_create' %}">
                Add Book
            </a>

            <a href="{% url 'trash' %}">
                🗑️ Trash
            </a>
        </nav>

    </header>


    <!-- Main content -->
    <main>

        <div class="container">

            <!-- Django messages -->
            {% if messages %}
                {% for message in messages %}
                    <p class="message">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}


            <!-- Page content -->
            {% block content %}
            {% endblock %}

        </div>

    </main>


    <!-- Splash cursor JavaScript -->
    <script>

        const splash = document.getElementById("splash");

        document.addEventListener("mousemove", function(event) {

            splash.style.left = event.clientX + "px";
            splash.style.top = event.clientY + "px";

        });

    </script>

</body>
</html>
