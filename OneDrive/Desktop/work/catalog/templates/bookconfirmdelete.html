{% extends 'base.html' %}

{% block title %}
Delete Book
{% endblock %}

{% block content %}

<h2>Delete Book</h2>

<p>
    Are you sure you want to move
    <strong>{{ book.title }}</strong>
    to the trash?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Move to Trash
    </button>
</form>

{% endblock %}
